<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 524 36" width="524" height="36">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 500; }
  </style>

  <!-- 1. AI Agents: blue-100 (最浅) -->
  <rect x="0" y="4" width="88" height="22" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
