  <text x="53" y="19" text-anchor="middle" fill="#1e40af">AI Agents</text>

  <!-- 2. LLMs: indigo-100 -->
  <rect x="96" y="4" width="60" height="22" rx="4" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="0.8"/>
  <circle cx="109" cy="15" r="5" fill="#818cf8"/>
  <text x="135" y="19" text-anchor="middle" fill="#3730a3">LLMs</text>

  <!-- 3. Python: blue-300 -->
  <rect x="164" y="4" width="70" height="22" rx="4" fill="#93c5fd" stroke="#3b82f6" stroke-width="0.8"/>
  <circle cx="177" cy="15" r="5" fill="#2563eb"/>
  <text x="208" y="19" text-anchor="middle" fill="#1e3a8a">Python</text>

  <!-- 4. JavaScript: indigo-300 -->
  <rect x="242" y="4" width="94" height="22" rx="4" fill="#a5b4fc" stroke="#6366f1" stroke-width="0.8"/>
