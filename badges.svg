<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 36" width="620" height="36">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 500; }
  </style>

  <!-- LLM: purple -->
  <rect x="0" y="4" width="46" height="22" rx="4" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="0.8"/>
  <text x="23" y="19" text-anchor="middle" fill="#6b21a8">LLM</text>

  <!-- Python: amber -->
  <rect x="54" y="4" width="66" height="22" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.8"/>
  <circle cx="67" cy="15" r="5" fill="#f59e0b"/>
  <text x="96" y="19" text-anchor="middle" fill="#92400e">Python</text>

  <!-- PyTorch: red -->
  <rect x="128" y="4" width="66" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
  <circle cx="141" cy="15" r="5" fill="#ef4444"/>
  <text x="170" y="19" text-anchor="middle" fill="#991b1b">PyTorch</text>

  <!-- React: blue -->
  <rect x="202" y="4" width="60" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
  <circle cx="215" cy="15" r="5" fill="#3b82f6"/>
  <text x="242" y="19" text-anchor="middle" fill="#1e40af">React</text>

  <!-- Node.js: green -->
  <rect x="270" y="4" width="68" height="22" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
