  <circle cx="359" cy="15" r="5" fill="#6366f1"/>
  <text x="396" y="19" text-anchor="middle" fill="#3730a3">TypeScript</text>

  <!-- Docker: slate -->
  <rect x="438" y="4" width="66" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <circle cx="451" cy="15" r="5" fill="#64748b"/>
